# /etc/nginx/sites-available/plateshift  — replace plateshift.example.com, then run:
#   sudo ln -s /etc/nginx/sites-available/plateshift /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d plateshift.example.com     (adds HTTPS)
server {
    listen 80;
    listen [::]:80;
    server_name plateshift.example.com;
    root /var/www/plateshift;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location /assets/   { expires 1y; add_header Cache-Control "public, immutable"; }
    location /profiles/ { expires 1d; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;
}
